[package]
name = "opc_nodeset_tools"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff tools"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
