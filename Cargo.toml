[package]
name = "opcua-nodeset-compass"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff tool"
license = "MIT"

[lib]
name = "compass"
path = "src/lib.rs"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
quick-xml = "0.36"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
anyhow = "1"
thiserror = "1"

[profile.dev]
opt-level = 0
