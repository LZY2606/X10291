[package]
name = "nodeset-compass"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff tool"

[[bin]]
name = "nodeset-compass"
path = "src/main.rs"

[lib]
name = "nodeset_compass"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"

[dev-dependencies]
tempfile = "3"
