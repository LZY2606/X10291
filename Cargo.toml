[package]
name = "nodeset_compass"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
tokio = { version = "1", features = ["full"] }
