[package]
name = "nscompass"
version = "0.1.0"
edition = "2021"
description = "Namespace compass: OPC UA NodeSet merge, reference closure and model diff"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.36"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 1
