[package]
name = "nscompass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff tool"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 0
