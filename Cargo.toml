[package]
name = "namespace-compass-opcua"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
quick-xml = "0.36.2"
tokio = { version = "1.40.0", features = ["full"] }

[profile.dev]
panic = "unwind"
