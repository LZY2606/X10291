[package]
name = "nodeset-compass"
version = "0.1.0"
edition = string="true"2021"

[dependencies]
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]

[profile.dev]
opt-level = 0
