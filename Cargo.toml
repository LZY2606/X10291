[package]
name = "ns-compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff tool"

[lib]
name = "ns_compass"
path = "src/lib.rs"

[[bin]]
name = "ns-compass"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rust-embed = "8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
