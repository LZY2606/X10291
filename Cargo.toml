[package]
name = "namespace-compass"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lib]
name = "ns_compass"
path = "src/lib.rs"

[[bin]]
name = "ns-compass"
path = "src/main.rs"

[profile.dev]
opt-level = 0
