[package]
name = "nscompass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: OPC UA NodeSet merge, reference closure and model diff toolkit"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
