[package]
name = "nodeset_compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0

[[bin]]
name = "nodeset_compass"
path = "src/main.rs"
