[package]
name = "ua-compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff"

[[bin]]
name = "ua-compass"
path = "src/main.rs"

[lib]
name = "ua_compass"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
