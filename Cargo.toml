[package]
name = "namespace-compass"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff tool"

[lib]
name = "compass"
path = "src/lib.rs"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.43"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
