[package]
name = "nodeset-compass"
version = "0.1.0"
edition = "2021"
description = "Replayable OPC UA NodeSet merge, reference closure and model diff tool"

[[bin]]
name = "nodeset-compass"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
