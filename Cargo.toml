[package]
name = "compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: OPC UA NodeSet merge, reference closure and model diff replay tool"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.31"
sha1 = "0.10"

[dev-dependencies]
