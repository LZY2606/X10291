[package]
name = "opc-compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff tool"

[lib]
name = "opccompass"
path = "src/lib.rs"

[[bin]]
name = "opc-compass"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.36"
sha2 = "0.10"

[profile.dev]
opt-level = 0
