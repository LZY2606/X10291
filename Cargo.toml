[package]
name = "opc-nodeset-compass"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[[bin]]
name = "opc-nodeset-compass"
path = "src/main.rs"
