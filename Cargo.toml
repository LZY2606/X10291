[package]
name = "nodeset-compass"
version = "0.1.0"
edition = "2021"
description = "Namespace Compass: replayable OPC UA NodeSet merge, reference closure and model diff tool"

[[bin]]
name = "nodeset-compass"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
