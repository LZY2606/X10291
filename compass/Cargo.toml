[package]
name = "compass"
version = "0.1.0"
edition = "2021"
description = "Namespace compass: OPC UA NodeSet merge, reference closure and model diff with replayable provenance"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
anyhow = "1"
thiserror = "2"

[profile.dev]
# Bundled SQLite compile is the dominant cost; keep test iteration reasonable.
opt-level = 0
