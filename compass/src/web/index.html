<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>命名空间罗盘 · OPC UA NodeSet 合并 / 闭包 / 差异</title>
<style>
  :root { --bg:#0f141b; --panel:#161d27; --line:#26313f; --fg:#dfe7ef; --mut:#8aa0b4;
          --accent:#5db1ff; --warn:#f0b35e; --bad:#f06e6e; --ok:#6fd08c; --conf:#c992ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  button { background:#21303f; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  select { background:#161d27; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px; }
  main { display:grid; grid-template-columns: 300px 1fr 360px; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--accent); letter-spacing:.04em; }
  .muted { color:var(--mut); }
  .ver { padding:6px 8px; border-radius:6px; margin-bottom:4px; cursor:pointer; border:1px solid transparent; }
  .ver:hover { border-color:var(--line); }
  .ver.active { border-color:var(--accent); background:#1b2735; }
  .tag { font:11px ui-monospace,Menlo,monospace; color:var(--mut); }
  .row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px dashed #202a36; }
  .sev-info { color:var(--accent); } .sev-warn { color:var(--warn); }
  .sev-anomaly { color:var(--bad); } .sev-conflict { color:var(--conf); }
  .sev-ok { color:var(--ok); }
  .clickable { cursor:pointer; text-decoration:underline dotted; }
  .nodecard { border:1px solid var(--line); border-radius:6px; padding:8px; margin:6px 0; }
  .badge { display:inline-block; padding:0 6px; border-radius:10px; font-size:11px; margin-right:6px; }
  .badge.kind { background:#223; color:#bcd; }
  .badge.unresolved { background:#422; color:#fcc; }
  .badge.dup { background:#42f; color:#eef; }
  svg text { fill:var(--fg); font:11px ui-monospace,Menlo,monospace; }
  svg line, svg path { stroke:#4a6b8a; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0d1218; border:1px solid var(--line); border-radius:6px; padding:10px; max-height:420px; overflow:auto; }
  mark { background:#5a4a1e; color:#fff; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button.active { background:#1d3b56; border-color:var(--accent); }
  .tour { position:fixed; right:16px; bottom:16px; max-width:340px; background:#12202e; border:1px solid var(--accent);
          border-radius:10px; padding:12px; box-shadow:0 10px 30px #0009; z-index:20; }
  .hidden { display:none; }
  .idcode { font:10px ui-monospace,Menlo,monospace; color:#6f8599; }
  table { border-collapse:collapse; width:100%; } td,th { border-bottom:1px solid #202a36; padding:4px 6px; text-align:left; vertical-align:top; }
  .pill { font-size:10px; padding:1px 6px; border-radius:8px; border:1px solid var(--line); color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>命名空间罗盘</h1>
  <span class="muted">OPC UA NodeSet 合并 · 引用闭包 · 模型差异 · 可重放溯源</span>
  <span style="flex:1"></span>
  <label class="muted">版本 <select id="versionSelect"></select></label>
  <button id="btnDiff">与父版本比较</button>
  <button id="btnExport">导出档案</button>
  <button id="btnReimport">删库重导入(模拟)</button>
  <button id="btnTour">开始 90 秒样例路径</button>
</header>

<main>
  <div id="leftCol">
    <div class="panel">
      <h2>版本 / 分支</h2>
      <div id="versions"></div>
    </div>
    <div class="panel">
      <h2>来源链与事件</h2>
      <div id="eventLog"></div>
    </div>
  </div>

  <div>
    <div class="tabs" id="tabs">
      <button data-tab="namespaces" class="active">Namespace 映射</button>
      <button data-tab="hierarchy">类型层次</button>
      <button data-tab="graph">引用图</button>
      <button data-tab="unresolved">未解析依赖</button>
      <button data-tab="diff">语义差异</button>
      <button data-tab="quantities">领域量 / 单位</button>
    </div>
    <div class="panel" id="tabPanel"></div>
  </div>

  <div>
    <div class="panel">
      <h2>对象与判定</h2>
      <div id="detail" class="muted">点击任何节点、边或异常点进入来源链。</div>
    </div>
    <div class="panel">
      <h2>传播结论</h2>
      <div id="propagation"></div>
    </div>
  </div>
</main>

<div id="tourBox" class="tour hidden">
  <b>90 秒样例路径</b>
  <p id="tourText" class="muted"></p>
  <div style="display:flex;gap:8px"><button id="tourNext">下一步</button><button id="tourClose">关闭</button></div>
</div>

<script src="/app.js"></script>
</body>
</html>
